name: TrendRadar Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Run TrendRadar
        env:
          GITHUB_ACTIONS: true
          AI_ANALYSIS_ENABLED: "true"
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: "openai/gpt-oss-20b:free"
          AI_API_BASE: "https://openrouter.ai/api/v1"
        run: uv run python -m trendradar

      - name: Show generated files
        if: always()
        run: |
          echo "=== generated files ==="
          find output -maxdepth 3 -type f -print 2>/dev/null || true
          test -f index.html && echo "index.html generated" || true

      - name: Upload TrendRadar result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendradar-result-${{ github.run_number }}
          path: |
            output/**
            index.html
          if-no-files-found: warn
          retention-days: 14
